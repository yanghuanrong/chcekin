name: Repo Keepalive

# 必须给 on 加引号，避免 YAML 把 on 解析成布尔值
"on":
  schedule:
    # 约每 30 天一次（每月 1 日 UTC 00:00 = 北京时间 08:00）
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  stamp-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update README timestamp
        run: |
          TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          MARKER='<!-- repo-keepalive:'
          if grep -qF "$MARKER" README.md; then
            sed -i "s|${MARKER}.*|${MARKER} ${TS} -->|" README.md
          else
            printf '\n%s %s -->\n' "$MARKER" "$TS" >> README.md
          fi

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: repo keepalive ${{ github.run_id }}"
          file_pattern: README.md
